name: Build & Push to GHCR

on:
  push:
    branches: [main]

env:
  # Defaults to "owner/repo" (e.g. "danie/physicsink").
  # Override by setting IMAGE_NAME in repo Settings → Secrets and variables → Actions → Variables.
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build Docker image and push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Auth ────────────────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Metadata (tags + labels) ─────────────────────────────────────────
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # immutable tag for rollbacks: sha-<short-sha>
            type=sha,prefix=sha-,format=short

      # ── Build ────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in GitHub Actions cache — speeds up subsequent runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
